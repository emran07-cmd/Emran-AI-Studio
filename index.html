<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emran AI Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2 class="logo">Emran <span>AI</span></h2>
            <nav>
                <button class="nav-btn active" onclick="showTab('chat')">Chat Playground</button>
                <button class="nav-btn" onclick="showTab('voice')">Voice Studio</button>
                <button class="nav-btn" onclick="showTab('settings')">Settings</button>
            </nav>
        </aside>

        <main class="main-content">
            <div id="chat-section">
                <header><h1>AI Chat Playground</h1></header>
                <div class="chat-window" id="chatWindow">
                    <div class="msg bot">Hello Emran! Main aapka AI assistant hoon.</div>
                </div>
                <div class="input-area">
                    <textarea id="userInput" placeholder="Kuch poochiye..."></textarea>
                    <button id="sendBtn">Send</button>
                </div>
            </div>

            <div id="voice-section" style="display:none;">
                <header><h1>Voice Studio</h1></header>
                <div class="chat-window">
                    <div class="msg bot">Voice generate karne ke liye niche text likhein.</div>
                </div>
                <div class="input-area">
                    <textarea id="voiceInput" placeholder="Jo bulwana hai likhein..."></textarea>
                    <button id="voiceBtn" style="background:#ec4899;">Generate Audio</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
